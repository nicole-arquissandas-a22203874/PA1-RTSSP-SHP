// RTSSP box configuration
// remote: address of the Streaming Server (host:port)
remote=localhost:8888
// localdelivery: where to forward decrypted frames (VLC/MPV listens here)
localdelivery=localhost:7777
// movie: which movie to request from the server
movie=cars.dat
// cryptoconfig: shared crypto config file
cryptoconfig=cryptoconfig.conf
